events {}

http {
    server {
        listen 80;

        # Streamlit frontend
        location / {
            proxy_pass http://127.0.0.1:8501/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI backend
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # MLflow base route
        location /mlflow/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Hardcoded paths required by MLflow UI to function properly
        location /ajax-api/ {
            proxy_pass http://127.0.0.1:5000/ajax-api/;
        }
        location /get-artifact/ {
            proxy_pass http://127.0.0.1:5000/get-artifact/;
        }
        location /static-files/ {
            proxy_pass http://127.0.0.1:5000/static-files/;
        }
        location /model-versions/ {
            proxy_pass http://127.0.0.1:5000/model-versions/;
        }
    }
}
